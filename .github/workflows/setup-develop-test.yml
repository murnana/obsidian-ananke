# =============================================================================
# Dev Container テストワークフロー
# =============================================================================
#
# このワークフローは、Dev Container の構成が正しく動作するかを検証します。
# コンテナ内で npm install・npm run build・npm test を実行し、
# ビルドとテストがともに成功することを確認します。
#
# セキュリティ対策:
#   - すべてのアクションは SHA ピン留め（SHA pinning）で指定しています。
#     タグ（例: v6）はリポジトリオーナーが上書き可能なため、
#     悪意あるコードに差し替えられるリスクがあります。
#     SHA を使うことで、特定のコミットに固定され、改ざんを防げます。
#   - permissions は最小権限の原則に従い、必要最低限のみ付与しています。
# =============================================================================

# ワークフロー名（GitHub Actions タブに表示される名前）
name: Test Dev Container

# 実行時の表示名（誰がトリガーしたかを表示）
run-name: Test Dev Container by @${{ github.actor }}

# -----------------------------------------------------------------------------
# トリガー条件
# -----------------------------------------------------------------------------
# - push: main または develop ブランチへのプッシュ時に実行
# - pull_request: main または develop ブランチへのプルリクエスト時に実行
# - workflow_dispatch: GitHub UI から手動で実行可能
# -----------------------------------------------------------------------------
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# -----------------------------------------------------------------------------
# ワークフローレベルの権限
# -----------------------------------------------------------------------------
# デフォルトですべての権限を無効化し、ジョブごとに必要な権限のみ付与します。
# これにより、万が一アクションが侵害されても被害を最小限に抑えられます。
# -----------------------------------------------------------------------------
permissions: {}

# -----------------------------------------------------------------------------
# 同時実行制御
# -----------------------------------------------------------------------------
# 同じワークフロー・同じブランチの実行が重複した場合、
# 古い実行をキャンセルして最新の実行のみを残します。
# これにより、CI リソースの無駄遣いを防ぎます。
# -----------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# ジョブ定義
# =============================================================================
jobs:
  test-dev-container:
    runs-on: ubuntu-latest

    # このジョブに必要な権限: リポジトリの内容を読み取るのみ
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # ステップ 1: リポジトリのチェックアウト
      # -----------------------------------------------------------------------
      # ソースコードと .devcontainer/ の設定ファイルを取得します。
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # -----------------------------------------------------------------------
      # ステップ 2: Dev Container 内でビルドとテストを実行
      # -----------------------------------------------------------------------
      # devcontainers/ci アクションが .devcontainer/devcontainer.json を読み取り、
      # コンテナをビルド・起動した上で、runCmd に指定したコマンドを実行します。
      #
      # 実行内容:
      #   1. npm install    — 依存パッケージをインストール
      #   2. npm run build  — TypeScript の型チェックと本番ビルド
      #   3. npm test       — 単体テストを実行（node:test + ts-node 使用）
      #                       いずれかのテストが失敗した場合はステップが失敗扱いになります
      # -----------------------------------------------------------------------
      - name: Run inside Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          runCmd: |
            npm install
            npm run build
            npm test
