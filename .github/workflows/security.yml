# =============================================================================
# セキュリティスキャンワークフロー
# =============================================================================
#
# このワークフローは、依存関係とソースコードのセキュリティ脆弱性を
# 自動的に検出します。
#
# 実行タイミング:
#   - main または develop ブランチへのプッシュ時
#   - main または develop ブランチへのプルリクエスト時
#   - 毎週月曜日 午前9時（UTC）に自動実行
#
# 実行内容:
#   1. npm audit - npm パッケージの既知の脆弱性をチェック
#   2. CodeQL 分析 - TypeScript コードの静的セキュリティ解析
#
# セキュリティ対策:
#   - アクションはできる限り SHA ピン留めを使用しています。
#   - permissions は最小権限の原則に従い、必要最低限のみ付与しています。
#   - 検出された脆弱性は GitHub Security タブで確認できます。
# =============================================================================

# ワークフロー名（GitHub Actions タブに表示される名前）
name: Security Scan

# 実行時の表示名
run-name: Security Scan by @${{ github.actor }}

# -----------------------------------------------------------------------------
# トリガー条件
# -----------------------------------------------------------------------------
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 毎週土曜日 午前9時（UTC）= 日本時間 午後6時
    - cron: '0 9 * * 6'
  workflow_dispatch:  # 手動実行も可能

# -----------------------------------------------------------------------------
# ワークフローレベルの権限
# -----------------------------------------------------------------------------
# デフォルトですべての権限を無効化し、ジョブごとに必要な権限のみ付与します。
# -----------------------------------------------------------------------------
permissions: {}

# -----------------------------------------------------------------------------
# 同時実行制御
# -----------------------------------------------------------------------------
# 同じワークフロー・同じブランチの実行が重複した場合、
# 古い実行をキャンセルして最新の実行のみを残します。
# -----------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# ジョブ定義
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # ジョブ 1: npm パッケージの脆弱性スキャン
  # ---------------------------------------------------------------------------
  npm-audit:
    runs-on: ubuntu-latest

    permissions:
      contents: read  # リポジトリの読み取り

    steps:
      # -----------------------------------------------------------------------
      # ステップ 1: リポジトリのチェックアウト
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # -----------------------------------------------------------------------
      # ステップ 2: Dev Container 内で npm audit を実行
      # -----------------------------------------------------------------------
      # devcontainers/ci アクションが .devcontainer/devcontainer.json を読み取り、
      # コンテナをビルド・起動した上で、npm audit を実行します。
      # ローカル開発環境と完全に同一の環境でセキュリティチェックが実行されます。
      #
      # npm パッケージの既知の脆弱性をチェックします。
      #
      # 終了コード:
      #   0: 脆弱性なし
      #   1: 脆弱性あり
      #
      # --audit-level=moderate:
      #   moderate 以上（moderate, high, critical）の脆弱性で失敗させます。
      #   low レベルの脆弱性は警告のみで、ワークフローは失敗しません。
      # -----------------------------------------------------------------------
      - name: Run npm audit in Dev Container
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3
        with:
          runCmd: |
            npm install
            npm audit --audit-level=moderate

  # ---------------------------------------------------------------------------
  # ジョブ 2: CodeQL によるコード脆弱性スキャン
  # ---------------------------------------------------------------------------
  codeql:
    runs-on: ubuntu-latest

    permissions:
      contents: read           # リポジトリの読み取り
      security-events: write   # CodeQL の結果を Security タブにアップロード

    steps:
      # -----------------------------------------------------------------------
      # ステップ 1: リポジトリのチェックアウト
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # -----------------------------------------------------------------------
      # ステップ 2: CodeQL の初期化
      # -----------------------------------------------------------------------
      # CodeQL を初期化し、スキャン対象の言語を指定します。
      #
      # languages: javascript
      #   TypeScript も JavaScript として解析されます。
      #
      # queries: security-and-quality
      #   セキュリティとコード品質の両方をチェックするクエリセットを使用します。
      # -----------------------------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f268e62a13468170ab6417f4075bbff92cb826f9 # v3.28.6
        with:
          languages: javascript
          queries: security-and-quality

      # -----------------------------------------------------------------------
      # ステップ 3: CodeQL 分析の実行
      # -----------------------------------------------------------------------
      # CodeQL によるコード解析を実行します。
      # 結果は GitHub の Security タブ > Code scanning alerts で確認できます。
      #
      # 検出される問題の例:
      #   - SQL インジェクション
      #   - XSS（クロスサイトスクリプティング）
      #   - コマンドインジェクション
      #   - パストラバーサル
      #   - 安全でない乱数生成
      #   - ハードコードされた認証情報
      # -----------------------------------------------------------------------
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f268e62a13468170ab6417f4075bbff92cb826f9 # v3.28.6
